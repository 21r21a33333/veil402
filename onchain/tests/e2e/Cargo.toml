[package]
name = "pool-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Client + program pinned to the same solana 2.x line as the pool program (anchor 0.32), so the
# generated instruction/account builders interoperate. The program itself is loaded into a real
# `solana-test-validator` as bytecode and driven over RPC, which decouples runtime from crate versions.
solana-sdk = "2.3"
solana-client = "2.3"
pool = { path = "../../programs/pool", features = ["no-entrypoint"] }
anchor-lang = "0.32.1"
spl-token = "7"
spl-associated-token-account = "7"
tempfile = "3"
serial_test = "3"
