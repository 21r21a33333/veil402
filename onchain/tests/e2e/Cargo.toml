[package]
name = "pool-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = "0.32.1"
light-concurrent-merkle-tree = { git = "https://github.com/Lightprotocol/light-protocol", rev = "790d01afd6c191e1e6d77479e4e20192ca09ca87" }
light-hasher = { git = "https://github.com/Lightprotocol/light-protocol", rev = "790d01afd6c191e1e6d77479e4e20192ca09ca87" }
pool = { path = "../../programs/pool", features = ["no-entrypoint"] }
solana-client = "2.3"
solana-sdk = "2.3"
solana-system-interface = { version = "1", features = ["bincode"] }
solana-transaction-status-client-types = "2.3"
solana-address-v1 = { package = "solana-address", version = "~2.6.1", features = ["atomic", "copy", "decode"] }
solana-commitment-config-v1 = { package = "solana-commitment-config", version = "3.0.0" }
solana-instruction-v1 = { package = "solana-instruction", version = "3.4.1" }
solana-keypair-v1 = { package = "solana-keypair", version = "3.1.2" }
solana-message-v1 = { package = "solana-message", version = "4.4.1" }
solana-rpc-client-v1 = { package = "solana-rpc-client", version = "4.2.1" }
solana-signer-v1 = { package = "solana-signer", version = "3.0.1" }
solana-transaction-v1 = { package = "solana-transaction", version = "4.1.6" }
spl-associated-token-account = "7"
spl-token = "8"
tempfile = "3"
veil402-sdk = { path = "../../../crates/veil402-sdk" }
wincode = "0.5.5"

[dev-dependencies]
base64 = "0.22"
num-bigint = "0.4"
serial_test = "3"
solana-keccak-hasher = "2.2.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
